name: PR validation

on:
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Text hygiene
        run: python scripts/check_text_hygiene.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r api/requirements-dev.txt
      - name: Test
        env:
          # Settings() refuses to load with no chat backend. CI has no .env.
          # This value is not a real key.
          ANTHROPIC_API_KEY: test-key-not-real
        run: python -m pytest
