services:
  qdrant:
    image: qdrant/qdrant:v1.13.0
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # Optional: only needed if DATABASE_URL is set below. Local dev defaults
  # to SQLite (DATABASE_URL empty), so this sits unused unless you opt in
  # to test the Postgres path that production (Azure Database for
  # PostgreSQL) actually uses. See api/services/db.py.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=realmpal
      - POSTGRES_PASSWORD=realmpal
      - POSTGRES_DB=realmpal
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - FOUNDRY_RESOURCE=${FOUNDRY_RESOURCE:-}
      - FOUNDRY_BASE_URL=${FOUNDRY_BASE_URL:-}
      - FOUNDRY_API_KEY=${FOUNDRY_API_KEY:-}
      - FOUNDRY_USE_ENTRA=${FOUNDRY_USE_ENTRA:-false}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-4-6}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      # Empty by default (SQLite). Uncomment to test against the local
      # postgres service above instead:
      # - DATABASE_URL=postgresql://realmpal:realmpal@postgres:5432/realmpal
      - DATABASE_URL=${DATABASE_URL:-}
      - EMBEDDING_BACKEND=${EMBEDDING_BACKEND:-ollama}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_ID=${STRIPE_PRICE_ID:-}
      - ENTITLEMENTS_DB_PATH=${ENTITLEMENTS_DB_PATH:-data/entitlements.db}
      - ACCOUNTS_DB_PATH=${ACCOUNTS_DB_PATH:-data/accounts.db}
      - UPLOADS_DB_PATH=${UPLOADS_DB_PATH:-data/uploads.db}
      - UPLOAD_TTL_DAYS=${UPLOAD_TTL_DAYS:-7}
      - WIKI_SCRAPE_TTL_HOURS=${WIKI_SCRAPE_TTL_HOURS:-168}
      - PLAYER_SCRAPE_TTL_SECONDS=${PLAYER_SCRAPE_TTL_SECONDS:-120}
      - JWT_SECRET=${JWT_SECRET}
      - MAGIC_LINK_SECRET=${MAGIC_LINK_SECRET:-}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - DEBUG=${DEBUG:-false}
    depends_on:
      - qdrant
      - redis
    volumes:
      - ./api:/app

  # Optional: local Ollama for free embeddings
  # ollama:
  #   image: ollama/ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama

volumes:
  qdrant_data:
  redis_data:
  postgres_data:
  # ollama_data:
